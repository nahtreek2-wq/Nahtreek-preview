// Each build type uses its own Firebase Android app; never fall back across environments.
android.sourceSets.main.java.srcDir(file('../../../../packages/android-push/src'))
android.buildTypes.all { variant ->
    def configFile = file("src/${variant.name}/google-services.json")
    def values = [FIREBASE_APP_ID: '', FIREBASE_API_KEY: '', FIREBASE_PROJECT_ID: '', FIREBASE_SENDER_ID: '']
    if (configFile.exists()) {
        def config = new groovy.json.JsonSlurper().parse(configFile)
        def packageName = android.defaultConfig.applicationId + (variant.applicationIdSuffix ?: '')
        def client = config.client.find { it.client_info.android_client_info.package_name == packageName }
        if (!client) throw new GradleException("Firebase configuration does not contain ${packageName}")
        values = [FIREBASE_APP_ID: client.client_info.mobilesdk_app_id,
                  FIREBASE_API_KEY: client.api_key[0].current_key,
                  FIREBASE_PROJECT_ID: config.project_info.project_id,
                  FIREBASE_SENDER_ID: config.project_info.project_number]
    }
    values.each { key, value -> variant.buildConfigField 'String', key, groovy.json.JsonOutput.toJson(value.toString()) }
}
dependencies { implementation 'com.google.firebase:firebase-messaging:24.1.0' }
